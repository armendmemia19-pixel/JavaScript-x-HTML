  <script>
  // a) Create the string
  const text = '  Web Programming  ';

  // b) Log length
  console.log("Length:", text.length);

  // Trim and convert to uppercase
  const trimmedText = text.trim();
  console.log("Uppercase:", trimmedText.toUpperCase());

  // Position of "Pro"
  console.log("Index of 'Pro':", trimmedText.indexOf("Pro"));

  // First word using slice
  console.log("First word:", trimmedText.slice(0, 3));
</script>
</body>
