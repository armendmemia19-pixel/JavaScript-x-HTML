<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Even or Odd</title>
</head>
<body>

  <button onclick="showEvenOdd()">Show numbers</button>
  <div id="output"></div>

  <script>
    function showEvenOdd() {
      let result = "";

      for (let i = 1; i <= 15; i++) {
        if (i % 2 === 0) {
          result += i + " is even<br>";
        } else {
          result += i + " is odd<br>";
        }
      }

      document.getElementById("output").innerHTML = result;
    }
  </script>

</body>
</html>
